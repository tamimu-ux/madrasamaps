const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const store={get(){try{return localStorage.getItem("dn_pw")}catch(_){return null}},set(v){try{localStorage.setItem("dn_pw",v)}catch(_){}},del(){try{localStorage.removeItem("dn_pw")}catch(_){}}};
async function open_(pw,remember){const k0=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
 const k=await crypto.subtle.deriveKey({name:"PBKDF2",salt:b64(P.s),iterations:P.i,hash:"SHA-256"},k0,{name:"AES-GCM",length:256},false,["decrypt"]);
 const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(P.v)},k,b64(P.c));
 const html=await new Response(new Blob([pt]).stream().pipeThrough(new DecompressionStream("gzip"))).text();
 if(remember)store.set(pw);document.open();document.write(html);document.close()}
const f=document.getElementById("f"),m=document.getElementById("m");
f.onsubmit=async ev=>{ev.preventDefault();m.textContent="Unlocking…";try{await open_(document.getElementById("p").value,document.getElementById("r").checked)}catch(_){m.textContent="Wrong password."}};
