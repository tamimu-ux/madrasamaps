async function open_(pw,remember){const k0=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
 const k=await crypto.subtle.deriveKey({name:"PBKDF2",salt:b64(P.s),iterations:P.i,hash:"SHA-256"},k0,{name:"AES-GCM",length:256},false,["decrypt"]);
 const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(P.v)},k,b64(P.c));
 const html=await new Response(new Blob([pt]).stream().pipeThrough(new DecompressionStream("gzip"))).text();
